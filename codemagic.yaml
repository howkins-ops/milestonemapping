# Codemagic CI: build, sign, and upload the iOS app to TestFlight — no Mac needed.
#
# One-time setup in the Codemagic dashboard (codemagic.io, sign in with GitHub):
#   1. Add this repository.
#   2. Teams → Integrations → App Store Connect: upload the .p8 API key
#      (App Store Connect → Users and Access → Integrations → Keys),
#      enter Key ID + Issuer ID. Name the integration "appstore_credentials".
#   3. Codemagic then creates/manages the distribution certificate and
#      provisioning profile automatically (fetch-signing-files below).
#   4. Create the app record in App Store Connect first (bundle ID
#      com.milestonemapping.app) so TestFlight publishing has a target.

workflows:
  ios-testflight:
    name: iOS → TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: appstore_credentials
    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: com.milestonemapping.app
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync ios
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE --create
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # ── Android → Play internal testing ──────────────────────────────────────
  #
  # One-time setup in the Codemagic dashboard:
  #   1. Teams → Integrations → Google Play: upload the service-account JSON
  #      (Play Console → Setup → API access → create service account, grant it
  #      "Release to testing tracks"). Name the variable group "google_play".
  #   2. Codemagic → this app → Environment variables, group "keystore_creds":
  #        CM_KEYSTORE           (the .jks, uploaded as a secure file)
  #        CM_KEYSTORE_PASSWORD
  #        CM_KEY_ALIAS
  #        CM_KEY_PASSWORD
  #      Generate the keystore once and BACK IT UP — losing it means you can
  #      never update the app under this package name again.
  #   3. Create the app in Play Console and upload one AAB by hand first; Play
  #      will not accept an API upload to a track that has never been released.
  #
  # Play requires an AAB (not an APK) and, for a personal developer account
  # created after 2023-11-13, a closed test with 12 testers for 14 consecutive
  # days before production is unlocked. Start that clock early.
  android-play:
    name: Android → Play internal
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      node: 22
      java: 21
      groups:
        - keystore_creds
      vars:
        PACKAGE_NAME: com.milestonemapping.app
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync android
      - name: Set up keystore
        script: |
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/release.keystore"
          cat >> "$CM_BUILD_DIR/android/key.properties" <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_BUILD_DIR/android/release.keystore
          EOF
      - name: Build AAB
        script: |
          cd android
          ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true
